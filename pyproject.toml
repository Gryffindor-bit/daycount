description = "记录每日收支、三餐与生活开销，查看日历明细、预算和月度统计。"
requires-python = ">=3.12"
authors = [
    { name = "Wen Xin", email = "1175182411@qq.com" }
]
dependencies = [
    "flet",
    "flet-charts"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.metadata]
title = "每日账本"

[tool.flet]
org = "dev.flet"
company = "Wen Xin"
copyright = "Copyright (C) 2026 by Wen Xin"

[tool.flet.app]
path = "src"
