name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet CLI
        run: python -m pip install --upgrade flet

      - name: Build Android APK
        run: flet build apk --yes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-ledger-android-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
