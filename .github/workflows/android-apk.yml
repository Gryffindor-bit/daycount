name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 新增：把secret里的base64还原成release.p12
      - name: Decode p12 keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Install Flet CLI
        run: python -m pip install --upgrade flet flet-cli

      # 修改这里，加上签名参数
      - name: Build Android APK
        run: >
          flet build apk --yes
          --android-signing-key-store $RUNNER_TEMP/release.p12
          --android-signing-key-alias ${{ secrets.KEY_ALIAS }}
          --android-signing-key-store-password ${{ secrets.STORE_PASSWORD }}
          --android-signing-key-password ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-ledger-android-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
